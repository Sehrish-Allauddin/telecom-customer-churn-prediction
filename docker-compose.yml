services:
  model-bootstrap:
    build:
      context: .
      target: training
    command: ["python", "-m", "src.bootstrap"]
    environment: &churn_environment
      CHURN_API_HOST: 0.0.0.0
      CHURN_API_PORT: 8000
      CHURN_MODEL_VERSION: ${CHURN_MODEL_VERSION:-2.0.0}
      CHURN_FEATURES_VERSION: ${CHURN_FEATURES_VERSION:-1.0.0}
      CHURN_THRESHOLD: ${CHURN_THRESHOLD:-0.50}
      CHURN_MEDIUM_RISK_THRESHOLD: ${CHURN_MEDIUM_RISK_THRESHOLD:-0.40}
      CHURN_HIGH_RISK_THRESHOLD: ${CHURN_HIGH_RISK_THRESHOLD:-0.70}
      CHURN_RANDOM_STATE: ${CHURN_RANDOM_STATE:-42}
      CHURN_TEST_SIZE: ${CHURN_TEST_SIZE:-0.20}
      CHURN_MODEL_DIR: /models
      CHURN_MODEL_PATH: /models/churn_model.pkl
      CHURN_METADATA_PATH: /models/model_metadata.json
      CHURN_PREDICTION_LOG_PATH: /app/logs/predictions.jsonl
    volumes:
      - churn_models:/models
      - churn_logs:/app/logs
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment: *churn_environment
    volumes:
      - churn_models:/models:ro
      - churn_logs:/app/logs
    depends_on:
      model-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: runtime
    command: ["streamlit", "run", "app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    ports:
      - "8501:8501"
    environment: *churn_environment
    volumes:
      - churn_models:/models:ro
      - churn_logs:/app/logs
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  churn_models:
  churn_logs:
